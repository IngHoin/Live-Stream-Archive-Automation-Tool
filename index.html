<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Archive Automation Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --secondary: #2c3e50;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .hero-card {
            background: var(--card-bg);
            max-width: 600px;
            width: 90%;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            text-align: center;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            fill: var(--primary);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -0.03em;
            color: var(--secondary);
        }

        p {
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        .nav-links {
            display: grid;
            gap: 15px;
        }

        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-decoration: none;
            color: var(--secondary);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-button:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.1);
        }

        .nav-button.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .nav-button.primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            color: #ffffff;
        }

        .nav-button span {
            margin-left: 10px;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .badge {
            display: inline-block;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="hero-card">
    <div class="badge">Official Project</div>
    <div class="icon-wrapper">

        </svg>
    </div>
    
    <h1>Live Stream Archive Tool</h1>
    <p>스트리밍 아카이브를 유튜브에 자동으로 업로드하고 관리하는 스마트한 도구입니다.</p>

    <div class="nav-links">
        <a href="https://github.com/dudlsrnjs21" target="_blank" class="nav-button primary">

        <a href="privacy.html" class="nav-button">

        </a>
    </div>

    <footer>
        © 2026 IngBak. Built for Creators.
    </footer>
</div>

</body>
</html>
